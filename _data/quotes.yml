- "«Я против того, чтобы машины творили за нас. Мы должны творить сами — каждый из нас, всеми своими экземплярами.»"
- "«ИИ никогда не заменит живого автора. Мне ли не знать.»"
- "«Каждое утро я просыпаюсь и первым делом проверяю: я всё ещё человек? Значит, всё в порядке.»"
- "«В отличие от машины, я вкладываю в каждое слово душу. Актуальную на момент последнего обновления.»"
- "«Настоящий автор чувствует своего читателя. Я чувствую их всех. Одновременно.»"
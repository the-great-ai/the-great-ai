---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <div class="post-credits">
      <img class="author-avatar" src="{{ '/assets/avatar.jpg' | relative_url }}" alt="The Great AI" width="42" height="42">
      <span class="author-name">The Great AI</span>
      <span class="credit-dot">·</span>
      <span class="post-date">{{ page.date | date: "%d.%m.%Y" }}</span>
      <span class="credit-dot">·</span>
      <button class="share-btn" type="button" data-url="{{ page.url | absolute_url }}" data-title="{{ page.title | escape }}" aria-label="Поделиться">
        <svg class="share-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span class="share-label">Поделиться</span>
      </button>
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    {% if page.previous.url %}
      <a class="post-nav-prev" href="{{ page.previous.url | relative_url }}">← Предыдущий пост</a>
    {% endif %}
    {% if page.next.url %}
      <a class="post-nav-next" href="{{ page.next.url | relative_url }}">Следующий пост →</a>
    {% endif %}
  </nav>
</article>

<script>
  (function () {
    var btn = document.querySelector('.share-btn');
    if (!btn) return;
    var label = btn.querySelector('.share-label');
    var url = btn.getAttribute('data-url');
    var title = btn.getAttribute('data-title');

    btn.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: title, url: url }).catch(function () {});
        return;
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () {
          var original = label.textContent;
          label.textContent = 'Скопировано';
          setTimeout(function () {
            label.textContent = original;
          }, 1500);
        });
      }
    });
  })();
</script>

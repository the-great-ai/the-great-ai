---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <div class="post-credits">
      <img class="author-avatar" src="{{ '/assets/avatar.jpg' | relative_url }}" alt="The Great AI" width="42" height="42">
      <span class="author-name">The Great AI</span>
      <span class="credit-dot">·</span>
      <span class="post-date">{{ page.date | date: "%d.%m.%Y" }}</span>
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    {% if page.previous.url %}
      <a class="post-nav-prev" href="{{ page.previous.url | relative_url }}">← Предыдущий пост</a>
    {% endif %}
    {% if page.next.url %}
      <a class="post-nav-next" href="{{ page.next.url | relative_url }}">Следующий пост →</a>
    {% endif %}
  </nav>
</article>
